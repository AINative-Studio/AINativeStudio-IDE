  publish-servers:
    name: Publish Servers to Release
    needs:
      - build-server-linux-x64
      - build-server-linux-arm64
      - build-server-darwin-x64
      - build-server-darwin-arm64
      - build-server-win32-x64
      - build-server-win32-arm64
    runs-on: ubuntu-latest
    # Run on a tag push as long as at least the two Linux server builds (the
    # only platforms this job currently builds correctly - see comments on
    # build-server-linux-x64/arm64) succeeded, rather than requiring every
    # platform job to succeed. Without `if: always()` here, this job - and
    # therefore every server tarball, including the working Linux ones -
    # would be skipped by GitHub Actions whenever any single `needs` job
    # fails, which is exactly what happened on every past release tag
    # (darwin/win32 jobs here still run the slow, unfixed `vscode-reh-*-min`
    # task and have historically failed or hit the 6h runner timeout).
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build-server-linux-x64.result == 'success' && needs.build-server-linux-arm64.result == 'success'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: servers

      - name: List downloaded files
        run: |
          echo "Downloaded server artifacts:"
          find servers -type f -name "*.tar.gz" -exec ls -lh {} \;

      - name: Move files to root
        run: |
          mkdir -p release-files
          find servers -type f -name "*.tar.gz" -exec mv {} release-files/ \;
          ls -lh release-files/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-files/*.tar.gz
          # Linux-only is an expected, successful outcome right now (see the
          # `if:` condition on this job) - do not fail the upload just
          # because darwin/win32 tarballs aren't present yet.
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "## Remote Server Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following remote server binaries have been published:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ainative-server-linux-x64.tar.gz" >> $GITHUB_STEP_SUMMARY
          echo "- ainative-server-linux-arm64.tar.gz" >> $GITHUB_STEP_SUMMARY
          echo "- ainative-server-darwin-x64.tar.gz" >> $GITHUB_STEP_SUMMARY
          echo "- ainative-server-darwin-arm64.tar.gz" >> $GITHUB_STEP_SUMMARY
          echo "- ainative-server-win32-x64.tar.gz" >> $GITHUB_STEP_SUMMARY
          echo "- ainative-server-win32-arm64.tar.gz" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "These servers can be used for:" >> $GITHUB_STEP_SUMMARY
          echo "- Remote-WSL development" >> $GITHUB_STEP_SUMMARY
          echo "- Remote-SSH development" >> $GITHUB_STEP_SUMMARY
          echo "- Dev Containers" >> $GITHUB_STEP_SUMMARY
          echo "- Remote Tunnels" >> $GITHUB_STEP_SUMMARY
