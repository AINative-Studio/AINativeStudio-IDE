name: Build Remote Extension Host Servers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Upload servers to GitHub release (requires tag)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  build-server-linux-x64:
    name: Build Server - Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: |
            ainative-studio/package-lock.json
            ainative-studio/build/package-lock.json

      # native-keymap and node-pty need these headers to build their native
      # addons during `npm ci` (node-gyp fails with "Package 'x11'/'xkbfile'
      # not found" otherwise - this was the actual cause of every prior
      # failure of this workflow, independent of the Node version used).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libkrb5-dev libgssapi-krb5-2

      - name: Install build dependencies
        working-directory: ainative-studio/build
        run: |
          for i in {1..5}; do
            npm ci && break
            if [ $i -eq 5 ]; then
              echo "npm ci in build/ failed too many times" >&2
              exit 1
            fi
            echo "npm ci failed $i, trying again..."
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        working-directory: ainative-studio
        run: |
          for i in {1..5}; do
            npm ci && break
            if [ $i -eq 5 ]; then
              echo "npm ci failed too many times" >&2
              exit 1
            fi
            echo "npm ci failed $i, trying again..."
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # #165: "Install dependencies" has failed on this job (and Linux ARM64's
      # equivalent step) every time this workflow has been run so far - specifically
      # on extensions/open-remote-ssh's own npm ci, which pulls ssh2/simple-socks as
      # GitHub-tarball dependencies (confirmed harmless/reproducible locally and in a
      # real matching Ubuntu 24.04 + Node 22.23.3 Docker container - ruled out an
      # OS/Node mismatch and an SSH-auth requirement by direct reproduction; npm
      # actually fetches these via an anonymous HTTPS tarball from
      # codeload.github.com, not a real git clone, so SSH was never actually
      # involved). The real failure only manifests on GitHub's own hosted runners,
      # and the actual npm debug log (referenced in the failure output as
      # /home/runner/.npm/_logs/*.log) has never been captured - this step uploads
      # it on failure so the next run actually tells us the real error instead of
      # just "command failed".
      - name: Upload npm debug logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-logs-linux-x64
          path: /home/runner/.npm/_logs/*.log
          if-no-files-found: warn
          retention-days: 7

      # The ainative-specific contrib code (src/vs/workbench/contrib/ainative)
      # imports its React panels from react/out/**/index.js, which only
      # exists after this build step runs - without it, compile-src fails
      # with "Cannot find module './react/out/.../index.js'" for every
      # ainative React surface (sidebar, settings, onboarding, tooltips,
      # etc.) This is the same step build-linux-arm64.yml's desktop build
      # already runs before compiling; the original version of this
      # workflow never built the server at all, so this gap was never hit.
      - name: Build React components
        working-directory: ainative-studio
        run: npm run buildreact
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Compile TypeScript
        working-directory: ainative-studio
        run: npm run gulp -- compile-build-without-mangling
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Compile extensions
        working-directory: ainative-studio
        run: |
          npm run gulp -- clean-extensions-build
          npm run gulp -- compile-non-native-extensions-build
          npm run gulp -- compile-extension-media-build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Minify remote server bundle
        working-directory: ainative-studio
        run: npm run gulp -- minify-vscode-reh
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Package remote server (linux x64)
        working-directory: ainative-studio
        run: npm run gulp -- vscode-reh-linux-x64-min-ci
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify build output
        run: |
          if [ ! -d "VSCode-reh-linux-x64" ]; then
            echo "::error::Build output directory VSCode-reh-linux-x64 not found!"
            ls -la .
            exit 1
          fi
          test -x VSCode-reh-linux-x64/node || { echo "::error::node runtime missing from server output"; exit 1; }
          test -d VSCode-reh-linux-x64/out || { echo "::error::out directory missing from server output"; exit 1; }
          test -d VSCode-reh-linux-x64/extensions || { echo "::error::extensions directory missing from server output"; exit 1; }

      - name: Archive server (ainative-server-linux-x64.tar.gz)
        run: |
          cd VSCode-reh-linux-x64
          tar --owner=0 --group=0 --numeric-owner -czf ../ainative-server-linux-x64.tar.gz .
          cd ..
          ls -lh ainative-server-linux-x64.tar.gz
          tar tzf ainative-server-linux-x64.tar.gz | head -40

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ainative-server-linux-x64
          path: ainative-server-linux-x64.tar.gz
          retention-days: 30

  build-server-linux-arm64:
    name: Build Server - Linux ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: |
            ainative-studio/package-lock.json
            ainative-studio/build/package-lock.json

      # Same native-addon headers as the x64 job above - see comment there.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libkrb5-dev libgssapi-krb5-2

      - name: Install build dependencies
        working-directory: ainative-studio/build
        run: |
          for i in {1..5}; do
            npm ci && break
            if [ $i -eq 5 ]; then
              echo "npm ci in build/ failed too many times" >&2
              exit 1
            fi
            echo "npm ci failed $i, trying again..."
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        working-directory: ainative-studio
        run: |
          for i in {1..5}; do
            npm ci && break
            if [ $i -eq 5 ]; then
              echo "npm ci failed too many times" >&2
              exit 1
            fi
            echo "npm ci failed $i, trying again..."
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # See the comment on the equivalent step in the Linux x64 job above (#165) -
      # captures the real npm debug log on failure instead of leaving us with just
      # "command failed".
      - name: Upload npm debug logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-logs-linux-arm64
          path: /home/runner/.npm/_logs/*.log
          if-no-files-found: warn
          retention-days: 7

      # See the comment on the equivalent step in build-server-linux-x64
      # above - compile-src fails without this.
      - name: Build React components
        working-directory: ainative-studio
        run: npm run buildreact
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Compile TypeScript
        working-directory: ainative-studio
        run: npm run gulp -- compile-build-without-mangling
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Compile extensions
        working-directory: ainative-studio
        run: |
          npm run gulp -- clean-extensions-build
          npm run gulp -- compile-non-native-extensions-build
          npm run gulp -- compile-extension-media-build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Minify remote server bundle
        working-directory: ainative-studio
        run: npm run gulp -- minify-vscode-reh
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Package remote server (linux arm64)
        working-directory: ainative-studio
        run: npm run gulp -- vscode-reh-linux-arm64-min-ci
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify build output
        run: |
          if [ ! -d "VSCode-reh-linux-arm64" ]; then
            echo "::error::Build output directory VSCode-reh-linux-arm64 not found!"
            ls -la .
            exit 1
          fi
          test -x VSCode-reh-linux-arm64/node || { echo "::error::node runtime missing from server output"; exit 1; }
          test -d VSCode-reh-linux-arm64/out || { echo "::error::out directory missing from server output"; exit 1; }
          test -d VSCode-reh-linux-arm64/extensions || { echo "::error::extensions directory missing from server output"; exit 1; }

      - name: Archive server (ainative-server-linux-arm64.tar.gz)
        run: |
          cd VSCode-reh-linux-arm64
          tar --owner=0 --group=0 --numeric-owner -czf ../ainative-server-linux-arm64.tar.gz .
          cd ..
          ls -lh ainative-server-linux-arm64.tar.gz
          tar tzf ainative-server-linux-arm64.tar.gz | head -40

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ainative-server-linux-arm64
          path: ainative-server-linux-arm64.tar.gz
          retention-days: 30

  build-server-darwin-x64:
    name: Build Server - macOS Intel
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
