app-id: com.ainativestudio.code
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: ainative-studio

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --filesystem=host
  - --device=dri
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --system-talk-name=org.freedesktop.UDisks2
  # Electron apps shipping their own Chromium sandbox need this unless the
  # bundled chrome-sandbox helper is re-exec'd through bwrap; VSCodium's own
  # manifest (flathub/com.vscodium.codium) carries the same two permissions
  # for the same reason - keep in sync with their approach rather than
  # reinventing the sandboxing story for an Electron app under Flatpak.
  - --allow=devel
  - --env=TMPDIR=/var/tmp

modules:
  - name: ainative-studio
    buildsystem: simple
    build-commands:
      # Flatpak modules can only unpack what the build-commands below
      # extract from `sources` - it does not build AINative Studio from
      # source. This mirrors how flathub/com.vscodium.codium packages
      # VSCodium: a real Flatpak manifest downloads one versioned
      # tarball release asset and repackages it; it does not compile
      # the IDE from source inside the Flatpak build sandbox. We are
      # NOT doing that here (compiling this repo takes >20 minutes with
      # an 8GB heap limit per CLAUDE.md, has no place in a Flatpak build
      # sandbox, and duplicates work the project's own CI already does).
      #
      # The real v1.1.0 Linux x64 tarball extracts flat (archive root is
      # `./`, no wrapper directory) and its own binary is still named
      # `void` internally - this release predates the full void->ainative
      # rebrand reaching the compiled output, even though its own
      # product.json already reports nameShort/nameLong "AINative Studio".
      # Confirmed directly: `tar -tzf AINativeStudio-v1.1.0-Linux-x64.tar.gz`
      # lists `./void` as the executable and
      # `./resources/app/resources/linux/code.png` as the only bundled
      # icon (itself still VS Code's stock icon, not a custom one).
      # Re-check this when pointing at a newer release - a future tarball
      # may ship a renamed binary/icon and this module needs updating to
      # match.
      - mkdir -p /app/ainative-studio
      - cp -r app/* /app/ainative-studio/
      - install -Dm755 /app/ainative-studio/void /app/bin/ainative-studio
      - install -Dm644 ainative-studio.desktop /app/share/applications/com.ainativestudio.code.desktop
      - install -Dm644 com.ainativestudio.code.metainfo.xml /app/share/metainfo/com.ainativestudio.code.metainfo.xml
      - install -Dm644 /app/ainative-studio/resources/app/resources/linux/code.png /app/share/icons/hicolor/512x512/apps/com.ainativestudio.code.png
    sources:
      - type: archive
        url: https://github.com/AINative-Studio/AINativeStudio-IDE/releases/download/v1.1.0/AINativeStudio-v1.1.0-Linux-x64.tar.gz
        sha256: a6f6920998e9fabd97454240fbef4eaf8eb8f16b656e119ebc35692d033e70e0
        dest: app
        # No .sha256 asset was published alongside this release (checked
        # `gh release view v1.1.0 --json assets` - none of the Linux
        # assets have a matching .sha256 file, unlike v2.0.0's macOS/
        # Windows assets which do). Computed directly: downloaded the
        # real asset and ran `shasum -a 256` on it myself, 2026-10-06.
      - type: file
        path: ainative-studio.desktop
      - type: file
        path: com.ainativestudio.code.metainfo.xml
